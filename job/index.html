<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clocked In · YourFirstShift</title>
<meta name="description" content="Your hours, your paycheck estimate, your PTO and your job codes. Your record, on your phone.">
<meta name="theme-color" content="#0F172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clocked In">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/job/manifest.webmanifest">
<link rel="apple-touch-icon" href="/job/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/job/icon-192.png">
<style>
:root{--ink:#0F172A;--ink2:#334155;--muted:#64748B;--line:#E2E8F0;--bg:#F8FAFC;--card:#fff;--go:#047857;--go2:#10B981;--amber:#B45309;--amberbg:#FEF3C7;--red:#B91C1C;--blue:#1D4ED8;}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;}
.hd{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;}
.hd .brand{font-weight:800;font-size:18px;letter-spacing:-.2px;}
.hd .brand span{color:var(--amber);}
.hd .sub{font-size:13px;color:var(--muted);font-weight:600;}
.hd .sp{flex:1;}
.hd a.back{font-size:14px;font-weight:700;color:var(--blue);text-decoration:none;padding:8px 4px;}
.pro-pill{font-size:12px;font-weight:800;color:var(--go);background:#ECFDF5;border:1px solid #A7F3D0;border-radius:999px;padding:3px 9px;}
main{padding:14px 16px calc(96px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;}
.pdchk{display:flex;justify-content:flex-end;align-items:center;gap:8px;min-height:44px;margin:-6px 0 2px;font-size:14px;font-weight:700;color:var(--ink2);cursor:pointer;-webkit-tap-highlight-color:transparent;}.pdchk input{width:22px;height:22px;margin:0;accent-color:var(--go);}
#storeBar{max-width:720px;margin:0 auto;padding:14px 16px 0;}#storeBar:empty{display:none;}#storeBar>div{margin:0!important;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;}
.card h2{margin:0 0 8px;font-size:18px;}
.muted{color:var(--muted);font-size:14px;}
.fine{color:var(--muted);font-size:13px;line-height:1.45;}
.big{font-size:34px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
.mid{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;}
.row{display:flex;align-items:center;gap:10px;}
.row.wrap{flex-wrap:wrap;}
.grow{flex:1;min-width:0;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 18px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:17px;}
.btn.block{display:flex;width:100%;}
.btn.go{background:var(--go);border-color:var(--go);color:#fff;}
.btn.stop{background:var(--red);border-color:var(--red);color:#fff;}
.btn.amber{background:#F59E0B;border-color:#F59E0B;color:#111;}
.btn.ghost{border-color:#CBD5E1;}
.btn.small{min-height:44px;padding:8px 12px;font-size:15px;}
.btn.huge{min-height:96px;font-size:26px;letter-spacing:.5px;border-radius:18px;}
.btn:disabled{opacity:.5;}
.link{background:none;border:0;padding:6px 0;color:var(--blue);font-weight:700;text-decoration:underline;font-size:15px;}
label.f{display:block;font-size:14px;font-weight:700;color:var(--ink2);margin:12px 0 4px;}
input.i,select.i,textarea.i{width:100%;min-height:50px;padding:10px 12px;border:2px solid #CBD5E1;border-radius:10px;background:#fff;font-size:17px;}
textarea.i{min-height:80px;}
.chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:15px;}
.chk input{width:24px;height:24px;flex:none;margin-top:1px;}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
.tabs button{background:none;border:0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;color:#475569;}
.tabs button[aria-current=page]{color:var(--blue);}
.tabs svg{width:24px;height:24px;}
.alert{border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:15px;font-weight:600;}
.alert.ot{background:var(--amberbg);color:#78350F;border:1px solid #FCD34D;}
.alert.ok{background:#ECFDF5;color:#065F46;border:1px solid #A7F3D0;}
.alert.info{background:#EFF6FF;color:#1E3A8A;border:1px solid #BFDBFE;}
.timer{font-size:52px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;text-align:center;margin:6px 0;}
.state{text-align:center;font-weight:700;color:var(--go);}
.state.brk{color:var(--amber);}
.list{list-style:none;margin:0;padding:0;}
.list li{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:10px;align-items:center;}
.list li:first-child{border-top:0;}
.ent{width:100%;text-align:left;background:none;border:0;padding:0;display:flex;gap:10px;align-items:center;}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:6px;padding:2px 7px;margin-right:4px;}
.tag.ot{background:var(--amberbg);color:#92400E;}
.tag.pto{background:#EDE9FE;color:#5B21B6;}
.tag.code{background:#F1F5F9;color:#334155;}
.wk{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
.wk th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:6px 4px;font-weight:800;}
.wk th:first-child,.wk td:first-child{text-align:left;}
.wk td{border-top:1px solid var(--line);padding:12px 4px;text-align:right;font-size:16px;}
.wk tr.today td{background:#F0F9FF;}
.wk tr.tap{cursor:pointer;}
.wk .d{font-weight:800;}
.wk .dd{font-size:12px;color:var(--muted);font-weight:600;}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;}
.tot .k{font-weight:700;color:var(--ink2);}
.tot.main .v{font-size:26px;font-weight:800;}
.est{font-size:12px;font-weight:800;color:#92400E;background:var(--amberbg);border-radius:6px;padding:2px 6px;vertical-align:middle;}
.codes{display:block;margin-top:4px;line-height:1.7;}
.cd{display:inline-block;background:#F1F5F9;color:#0F172A;border-radius:6px;padding:1px 7px;margin:0 5px 3px 0;font-size:14px;font-weight:700;word-break:break-word;}
.cd i{font-style:normal;font-weight:800;color:#475569;font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-right:4px;}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;}
.cgrid .w2{grid-column:1 / -1;}
.cgrid>div{min-width:0;}
.rcs{margin:6px 0 2px;}
.rc{display:flex;gap:6px;margin-top:6px;}
.rc .rcf{flex:1;min-width:0;min-height:48px;text-align:left;background:#F1F5F9;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-size:15px;font-weight:700;color:#0F172A;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rc .rcx{flex:none;width:48px;min-height:48px;background:#fff;border:2px solid var(--line);border-radius:12px;font-size:18px;color:#475569;}
.tsday{border-top:1px solid var(--line);padding:6px 0;}
.tsday:first-child{border-top:0;}
.tsday.today{background:#F0F9FF;margin:0 -12px;padding:6px 12px;}
.tsd{width:100%;min-height:48px;display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;text-align:left;font-size:16px;font-variant-numeric:tabular-nums;color:inherit;}
.tsd .d{font-weight:800;}.tsd .dd{font-size:13px;color:var(--muted);font-weight:600;}
.tsd .tsh{font-weight:800;white-space:nowrap;}.tsd .tsp{min-width:76px;text-align:right;white-space:nowrap;}
.tsl li{padding:8px 0 8px 10px;border-top:1px dashed var(--line);border-left:3px solid #E2E8F0;}
.tsl li:first-child{border-top:1px dashed var(--line);}
.tsl .ent{align-items:flex-start;font-size:15px;color:inherit;}
.wknav{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;}
.wknav button{min-width:52px;min-height:52px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:22px;font-weight:800;}
.wknav .t{font-weight:800;}
.modal{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));}
.sheet h3{margin:0 0 6px;font-size:20px;}
.sheet .x{float:right;border:0;background:#F1F5F9;border-radius:999px;width:44px;height:44px;font-size:22px;font-weight:800;}
.math{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px;}
.math td{padding:8px 2px;border-top:1px solid var(--line);vertical-align:top;}
.math td:last-child{text-align:right;white-space:nowrap;font-weight:700;}
.math tr.sum td{font-weight:800;border-top:2px solid var(--ink);}
.split{display:grid;grid-template-columns:1fr 96px 44px;gap:8px;align-items:center;margin:6px 0;}
.a2hs{background:#0F172A;color:#fff;border-radius:14px;padding:14px 16px;margin:0 0 14px;font-size:15px;}
.a2hs b{color:#FCD34D;}
.a2hs .row{margin-top:8px;}
.a2hs button{background:#fff;color:#0F172A;border:0;border-radius:10px;min-height:44px;padding:8px 14px;font-weight:800;}
.a2hs .x2{background:none;color:#CBD5E1;text-decoration:underline;}
.foot{margin:18px 0 0;text-align:center;}
.empty{text-align:center;color:var(--muted);font-size:15px;padding:8px 6px;}
.star{background:none;border:0;font-size:24px;min-width:44px;min-height:44px;color:#CBD5E1;}
.star.on{color:#F59E0B;}
.lock{font-size:13px;font-weight:800;color:var(--amber);}
.toast{pointer-events:none;}
.toast button{pointer-events:auto;margin-left:12px;background:#fff;color:#0F172A;border:0;border-radius:8px;min-height:40px;padding:6px 14px;font-weight:800;font-size:15px;}
.hist{list-style:none;margin:10px 0 0;padding:0;}
.hist li{border-top:1px solid var(--line);padding:10px 0;font-size:15px;line-height:1.45;overflow-wrap:anywhere;word-break:break-word;}
.hist li:first-child{border-top:0;}
.err{color:var(--red);font-weight:700;margin-top:10px;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;background:#0F172A;color:#fff;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;max-width:92vw;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
@media(min-width:760px){.modal{align-items:center;}.sheet{border-radius:18px;}}
</style>
</head>
<body>
<header class="hd">
  <div><div class="brand">Your<span>First</span>Shift™</div><div class="sub">Clocked In · track your hours, check your paycheck</div></div>
  <div class="sp"></div>
  <span id="proPill" class="pro-pill" hidden>PRO</span>
  <a class="back" href="/app.html">Resume tools</a>
</header>
<div id="storeBar"></div>
<main id="view" aria-live="polite"></main>
<nav class="tabs" aria-label="Clocked In">
  <button type="button" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>Clock</button>
  <button type="button" data-v="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Timesheet</button>
  <button type="button" data-v="pto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20h16M6 20V9l6-5 6 5v11M10 20v-5h4v5"/></svg>PTO</button>
  <button type="button" data-v="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
</nav>
<script>
/* opened as /job (no slash, e.g. through a rewrite): put the slash back so the address matches the app's home (/job/) for offline use and Add to Home Screen */
try{if(location.pathname==='/job')history.replaceState(null,'','/job/'+location.search+location.hash);}catch(_){}
/* YourFirstShift — On the Job, Phase 1.
   Worker-owned record. Everything stays in this browser (localStorage). No GPS, no server, no employer access.
   Paycheck numbers are ESTIMATES from a dated table file (tax-2026.json). The employer's payroll is the final word. */
(function(){
'use strict';
var KEY='yfs_otj_v1', FREE_JOBS=1;
var TAX=null, S=null, VIEW='today', WEEK_OFF=0, TICK=null, BIP=null;
var DAY=86400000;
var STATES=[['AL','Alabama'],['AK','Alaska'],['AZ','Arizona'],['AR','Arkansas'],['CA','California'],['CO','Colorado'],['CT','Connecticut'],['DE','Delaware'],['DC','District of Columbia'],['FL','Florida'],['GA','Georgia'],['HI','Hawaii'],['ID','Idaho'],['IL','Illinois'],['IN','Indiana'],['IA','Iowa'],['KS','Kansas'],['KY','Kentucky'],['LA','Louisiana'],['ME','Maine'],['MD','Maryland'],['MA','Massachusetts'],['MI','Michigan'],['MN','Minnesota'],['MS','Mississippi'],['MO','Missouri'],['MT','Montana'],['NE','Nebraska'],['NV','Nevada'],['NH','New Hampshire'],['NJ','New Jersey'],['NM','New Mexico'],['NY','New York'],['NC','North Carolina'],['ND','North Dakota'],['OH','Ohio'],['OK','Oklahoma'],['OR','Oregon'],['PA','Pennsylvania'],['RI','Rhode Island'],['SC','South Carolina'],['SD','South Dakota'],['TN','Tennessee'],['TX','Texas'],['UT','Utah'],['VT','Vermont'],['VA','Virginia'],['WA','Washington'],['WV','West Virginia'],['WI','Wisconsin'],['WY','Wyoming']];
var DEFAULT_LABELS={proj:'Job / Project #',po:'PO # + Line',cost:'Cost Code',wo:'Work Order #'};

/* Codes a worker copies onto the employer's timesheet. Saved on each entry, all optional, plain text. [key, label, short label, max length] */
var CODE_F=[['job','Job # or name','Job',40],['task','Task / activity code','Task',30],['cost','Cost code','Cost',30],['pay','Pay code','Pay',12],['po','PO #','PO',30]];
function cleanCodes(c){var out={};if(c&&typeof c==='object'&&!Array.isArray(c))CODE_F.forEach(function(f){var v=c[f[0]];if(v==null||typeof v==='object')return;v=String(v).replace(/[\u0000-\u001f\u007f]/g,' ').replace(/\s+/g,' ').trim().slice(0,f[3]);if(v)out[f[0]]=v;});return out;}
function hasCodes(c){return !!c&&CODE_F.some(function(f){return !!c[f[0]];});}
function codesText(c){c=c||{};return CODE_F.filter(function(f){return c[f[0]];}).map(function(f){return f[2]+' '+c[f[0]];}).join(' · ');}
function codesLine(c){if(!hasCodes(c))return '';return '<span class="codes">'+CODE_F.filter(function(f){return c[f[0]];}).map(function(f){return '<span class="cd" data-code="'+f[0]+'"><i>'+f[2]+'</i>'+esc(c[f[0]])+'</span>';}).join('')+'</span>';}
function codeInputs(pfx,c){c=c||{};var ph={job:'e.g. 4471 or Station 9',task:'e.g. WELD',cost:'e.g. 03-100',pay:'REG, OT, PTO',po:'e.g. 4500-18'};
  return '<div class="cgrid">'+CODE_F.map(function(f){return '<div'+(f[0]==='job'?' class="w2"':'')+'><label class="f" for="'+pfx+f[0]+'">'+f[1]+'</label><input class="i" id="'+pfx+f[0]+'" value="'+esc(c[f[0]]||'')+'" maxlength="'+f[3]+'" placeholder="'+ph[f[0]]+'" autocomplete="off" autocorrect="off" spellcheck="false"'+(f[0]==='pay'?' list="payList"':'')+'></div>';}).join('')+'<div class="w2 fine" data-payhelp style="margin-top:4px">Pay code: Optional. Only for your employer\'s timesheet. Overtime is tracked for you.</div></div><datalist id="payList"><option value="REG"><option value="OT"><option value="DT"><option value="PTO"><option value="HOL"><option value="SICK"></datalist>';}
/* Recent code sets: the last 5 different sets a worker used, newest first. One tap fills every box, so nobody retypes when they switch jobs. */
var RECENT_MAX=5;
function recentCodes(){return Array.isArray(S.ui.recentCodes)?S.ui.recentCodes:[];}
function pushRecent(c){c=cleanCodes(c);if(!hasCodes(c))return;var k=codesText(c);S.ui.recentCodes=[c].concat(recentCodes().filter(function(x){return codesText(x)!==k;})).slice(0,RECENT_MAX);}
function recentRow(pfx){var r=recentCodes();if(!r.length)return '';
  return '<div class="rcs" id="'+pfx+'recent"><div class="fine">Used before. Tap to fill:</div>'+r.map(function(c,i){return '<div class="rc"><button type="button" class="rcf" data-rc="'+i+'">'+esc(codesText(c))+'</button><button type="button" class="rcx" data-rx="'+i+'" aria-label="Forget these codes">✕</button></div>';}).join('')+'</div>';}
/* Each button is tied to the SET it shows (captured here), never to a position in the list: forgetting one row must not change what the other rows do. */
function wireRecent(m,pfx){var shown=recentCodes().slice();
  m.querySelectorAll('[data-rc]').forEach(function(b){var c=shown[+b.dataset.rc];b.addEventListener('click',function(){if(!c)return;CODE_F.forEach(function(f){var el=document.getElementById(pfx+f[0]);if(el)el.value=c[f[0]]||'';});});});
  m.querySelectorAll('[data-rx]').forEach(function(b){var c=shown[+b.dataset.rx];b.addEventListener('click',function(){if(!c)return;var k=codesText(c);S.ui.recentCodes=recentCodes().filter(function(x){return codesText(x)!==k;});save();var row=b.closest('.rc');if(row)row.remove();if(!recentCodes().length){var box=document.getElementById(pfx+'recent');if(box)box.remove();}toast('Forgotten.');});});}
function readCodes(pfx){var o={};CODE_F.forEach(function(f){var el=document.getElementById(pfx+f[0]);if(el)o[f[0]]=el.value;});return cleanCodes(o);}

/* ── helpers ── */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function pad(n){return (n<10?'0':'')+n;}
function ymd(d){d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseYmd(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(k,n){var d=parseYmd(k);d.setDate(d.getDate()+n);return ymd(d);}
function hm(ms){var d=new Date(ms);var h=d.getHours(),m=d.getMinutes();var ap=h>=12?'pm':'am';h=h%12||12;return h+':'+pad(m)+ap;}
function timeVal(ms){var d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes());}
function money(n){n=Math.round((n||0)*100)/100;return (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function hrs(n){n=Math.round((n||0)*100)/100;return (Math.round(n*100)%100===0?n.toFixed(0):n.toFixed(2).replace(/0$/,''));}
function r2(n){return Math.round(n*100)/100;}
function dayName(k,long){return parseYmd(k).toLocaleDateString('en-US',long?{weekday:'long',month:'short',day:'numeric'}:{weekday:'short'});}
function shortDate(k){return parseYmd(k).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function todayKey(){return ymd(Date.now());}
function isPro(){try{return localStorage.getItem('yfs_pro')==='1';}catch(_){return false;}}
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}

/* ── storage (never auto-deletes) ── */
function blank(){return {app:'yfs-on-the-job',v:1,created:Date.now(),settings:null,labels:Object.assign({},DEFAULT_LABELS),jobs:[],codes:[],entries:[],pto:{buckets:[]},clock:null,log:[],lastBackup:null,pdCharge:{},pdDay:{},ui:{}};}
/* Repair damaged saved data (a bad or hand-edited backup file, a half-written save) so one bad record can never lock the worker out of their records. */
function clean(j){var o=function(x){return !!x&&typeof x==='object'&&!Array.isArray(x);},arr=function(x){return Array.isArray(x)?x.filter(o):[];},num=function(x){return typeof x==='number'&&isFinite(x);};
  j=Object.assign(blank(),o(j)?j:{});

  var rf=$('#restoreFile');if(rf)rf.addEventListener('change',restoreFile);
  if(S.clock&&S.clock.start&&VIEW==='today'){var t=function(){var el=$('#clkT');if(!el)return;var live={kind:'work',start:S.clock.start,breaks:(S.clock.breaks||[]).concat(S.clock.onBreak?[{s:S.clock.onBreak}]:[])};var nw=Date.now(),brk=live.breaks.reduce(function(x,b){return x+((b.e||nw)-b.s);},0);var sec=Math.max(0,Math.floor((nw-live.start-brk)/1000));el.textContent=Math.floor(sec/3600)+':'+pad(Math.floor(sec%3600/60))+':'+pad(sec%60);
      var w=weekNow(),d=w.days[todayKey()];var a=$('#earnToday'),b=$('#earnWeek'),pt=$('#pdTodayAmt');if(pt)pt.textContent=money(d.perDiem);if(a)a.textContent=money(d.gross+d.perDiem);if(b)b.textContent=money(w.tot.gross+w.tot.perDiem);var lo=$('#liveOT');if(lo){var hh=liveSplitHTML(w);if(lo.innerHTML!==hh)lo.innerHTML=hh;}};t();TICK=setInterval(t,1000);}}
function act(a,el){
  if(a==='a2hsx'){S.ui.a2hsX=1;save();render();return;}
  if(a==='install'&&BIP){BIP.prompt();BIP.userChoice.finally(function(){BIP=null;render();});return;}
  if(a==='start')return clockStart();
  if(a==='stop')return clockStop();
  if(a==='stillyes'){if(S.clock){S.clock.askedAt=Date.now();save();render();}return;}
  if(a==='forgot')return forgotModal();
  if(a==='break')return clockBreak();
  if(a==='add')return editEntry(null,{date:todayKey()});
  if(a==='addpto'){if(!S.pto.buckets.length){ptoDefaults();}return editEntry(null,{date:todayKey(),kind:'pto'});}
  if(a==='repeat')return repeatYesterday();
  if(a==='gopay'){go('week');return;}
  if(a==='wprev'){WEEK_OFF--;render();return;}
  if(a==='wnext'){WEEK_OFF++;render();return;}
  if(a==='math')return mathModal();
  if(a==='ptoDefaults'){ptoDefaults();render();return;}
  if(a==='addbucket')return bucketModal(null);
  if(a==='addjob'){if(!isPro()&&S.jobs.length>=FREE_JOBS)return upsell('Free covers 1 job. Pro tracks every job you work, with overtime figured separately for each employer.');return jobModal(null);}
  if(a==='clkcodes')return clockCodesModal();
  if(a==='forgotin'||a==='fixstart')return startTimeModal();
  if(a==='setup'){$('#view').innerHTML=setupHTML(false);wireSetup(false);return;}
  if(a==='backup')return backup();
  if(a==='restore'){$('#restoreFile').click();return;}
  if(a==='undorestore'){undoRestore();return;}
  if(a==='undolast'){undoLast();return;}
  if(a==='perdiem')return perDiemModal();
  if(a==='pdcharge')return pdChargeModal(el.dataset.wk);
  if(a==='rawdl')return rawDownload();
  if(a==='csv')return csvModal();
  if(a==='logview'){if(!isPro())return upsell('See every change with the time, the old value and the new value. Your history is always saved (free) and included in your Backup; viewing it here is Pro.');return logModal();}}

/* ── clock ── */
function clockStart(){var jid=($('#cJob')||{}).value||(S.jobs[0]&&S.jobs[0].id);
  S.clock={start:Date.now(),jobId:jid,codes:cleanCodes(S.ui.lastCodes),breaks:[],onBreak:null};S.ui.lastJob=jid;save();render();toast('Clocked in at '+hm(S.clock.start)+'.');}
function clockBreak(){var c=S.clock;if(!c)return;if(c.onBreak){c.breaks.push({s:c.onBreak,e:Date.now()});c.onBreak=null;toast('Back on the clock.');}else{c.onBreak=Date.now();toast('Break started. Break time doesn\'t count.');}save();render();}
/* endAt: the real stop time when the worker forgot to clock out (see forgotModal). Breaks that run past it are cut off there. */
function clockStop(endAt,why){var c=S.clock;if(!c)return;var real=Date.now(),now=(endAt&&endAt>c.start&&endAt<=real)?endAt:real;if(c.onBreak){c.breaks.push({s:c.onBreak,e:real});c.onBreak=null;}
  c.breaks=c.breaks.filter(function(b){return b.s<now;}).map(function(b){return {s:b.s,e:Math.min(b.e,now)};});
  var brk=Math.round(c.breaks.reduce(function(a,b){return a+(b.e-b.s);},0)/60000);
  var e={id:uid(),kind:'work',date:ymd(c.start),start:c.start,end:now,breakMin:brk,jobId:c.jobId,codeId:'',splits:[],note:'',created:real,src:'clock'};if(hasCodes(c.codes))e.codes=cleanCodes(c.codes);
  S.entries.push(e);log(e.id,'(created)','',entrySummary(e),why||'clock');pushRecent(e.codes);S.clock=null;save();render();toast('Saved: '+hrs(entryHours(e))+' hrs.');}

window.OTJ={logLines:logLines,bonusCalc:bonusCalc,otOf:otOf,weekShare:weekShare,ruleText:ruleText,cleanOt:cleanOt,entryHours:entryHours,computeWeek:computeWeek,takeHome:takeHome,ptoBalance:ptoBalance,periodRange:periodRange,rangeTotals:rangeTotals,buildCSV:buildCSV,state:function(){return S;},reload:function(){S=load();paintStore();render();},pdCharge:pdCharge,store:function(){return {stale:STORE.stale,ok:STORE.ok,ro:STORE.ro,dirty:STORE.dirty,note:STORE.note,bad:storeBad()};},DATA_V:DATA_V,storeTest:storeTest,tax:function(){return TAX;},autoClock:autoClockHook,
  hash:function(o){var t=new TextEncoder().encode(JSON.stringify(o||S));return crypto.subtle.digest('SHA-256',t).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});}};
STORE.ok=storeTest();S=load();paintStore();VIEW=(S.ui&&S.ui.view)||'today';if(VIEW==='codes')VIEW='week';
fetch('/job/tax-2026.json',{cache:'no-cache'}).then(function(r){return r.json();}).then(function(t){TAX=t;render();}).catch(function(){$('#view').innerHTML='<div class="card">Couldn\'t load the pay tables. Check your signal and reload once; after that it works offline.</div>';});
/* a new version of the app took over: reload once, and only when nothing unsaved or half-typed is on screen */
var swHad=false,swWant=false,swDone=false;
function swMaybeReload(){if(!swWant||swDone)return;if(storeBad()||document.getElementById('otjModal')||document.getElementById('sRate'))return;
  try{var k='otj_sw_reload',t=+sessionStorage.getItem(k)||0;if(t&&Date.now()-t<15000){swDone=true;return;}sessionStorage.setItem(k,String(Date.now()));}catch(_){}
  swDone=true;location.reload();}
if('serviceWorker' in navigator){swHad=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(!swHad){swHad=true;return;}swWant=true;swMaybeReload();});
  window.addEventListener('load',function(){navigator.serviceWorker.register('/job/sw.js',{scope:'/job/'}).catch(function(){});});}
})();
