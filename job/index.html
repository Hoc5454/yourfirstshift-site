<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>On the Job · YourFirstShift</title>
<meta name="description" content="Your hours, your paycheck estimate, your PTO and your job codes. Your record, on your phone.">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="On the Job">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/job/manifest.webmanifest">
<link rel="apple-touch-icon" href="/job/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/job/icon-192.png">
<style>
:root{--ink:#0F172A;--ink2:#334155;--muted:#64748B;--line:#E2E8F0;--bg:#F8FAFC;--card:#fff;--go:#047857;--go2:#10B981;--amber:#B45309;--amberbg:#FEF3C7;--red:#B91C1C;--blue:#1D4ED8;}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;}
.hd{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;}
.hd .brand{font-weight:800;font-size:18px;letter-spacing:-.2px;}
.hd .brand span{color:var(--amber);}
.hd .sub{font-size:13px;color:var(--muted);font-weight:600;}
.hd .sp{flex:1;}
.hd a.back{font-size:14px;font-weight:700;color:var(--blue);text-decoration:none;padding:8px 4px;}
.pro-pill{font-size:12px;font-weight:800;color:var(--go);background:#ECFDF5;border:1px solid #A7F3D0;border-radius:999px;padding:3px 9px;}
main{padding:14px 16px calc(96px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;}
.card h2{margin:0 0 8px;font-size:18px;}
.muted{color:var(--muted);font-size:14px;}
.fine{color:var(--muted);font-size:13px;line-height:1.45;}
.big{font-size:34px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
.mid{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;}
.row{display:flex;align-items:center;gap:10px;}
.row.wrap{flex-wrap:wrap;}
.grow{flex:1;min-width:0;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 18px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:17px;}
.btn.block{display:flex;width:100%;}
.btn.go{background:var(--go);border-color:var(--go);color:#fff;}
.btn.stop{background:var(--red);border-color:var(--red);color:#fff;}
.btn.amber{background:#F59E0B;border-color:#F59E0B;color:#111;}
.btn.ghost{border-color:#CBD5E1;}
.btn.small{min-height:44px;padding:8px 12px;font-size:15px;}
.btn.huge{min-height:96px;font-size:26px;letter-spacing:.5px;border-radius:18px;}
.btn:disabled{opacity:.5;}
.link{background:none;border:0;padding:6px 0;color:var(--blue);font-weight:700;text-decoration:underline;font-size:15px;}
label.f{display:block;font-size:14px;font-weight:700;color:var(--ink2);margin:12px 0 4px;}
input.i,select.i,textarea.i{width:100%;min-height:50px;padding:10px 12px;border:2px solid #CBD5E1;border-radius:10px;background:#fff;font-size:17px;}
textarea.i{min-height:80px;}
.chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:15px;}
.chk input{width:24px;height:24px;flex:none;margin-top:1px;}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
.tabs button{background:none;border:0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;color:#475569;}
.tabs button[aria-current=page]{color:var(--blue);}
.tabs svg{width:24px;height:24px;}
.alert{border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:15px;font-weight:600;}
.alert.ot{background:var(--amberbg);color:#78350F;border:1px solid #FCD34D;}
.alert.ok{background:#ECFDF5;color:#065F46;border:1px solid #A7F3D0;}
.alert.info{background:#EFF6FF;color:#1E3A8A;border:1px solid #BFDBFE;}
.timer{font-size:52px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;text-align:center;margin:6px 0;}
.state{text-align:center;font-weight:700;color:var(--go);}
.state.brk{color:var(--amber);}
.list{list-style:none;margin:0;padding:0;}
.list li{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:10px;align-items:center;}
.list li:first-child{border-top:0;}
.ent{width:100%;text-align:left;background:none;border:0;padding:0;display:flex;gap:10px;align-items:center;}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:6px;padding:2px 7px;margin-right:4px;}
.tag.ot{background:var(--amberbg);color:#92400E;}
.tag.pto{background:#EDE9FE;color:#5B21B6;}
.tag.code{background:#F1F5F9;color:#334155;}
.wk{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
.wk th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:6px 4px;font-weight:800;}
.wk th:first-child,.wk td:first-child{text-align:left;}
.wk td{border-top:1px solid var(--line);padding:12px 4px;text-align:right;font-size:16px;}
.wk tr.today td{background:#F0F9FF;}
.wk tr.tap{cursor:pointer;}
.wk .d{font-weight:800;}
.wk .dd{font-size:12px;color:var(--muted);font-weight:600;}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;}
.tot .k{font-weight:700;color:var(--ink2);}
.tot.main .v{font-size:26px;font-weight:800;}
.est{font-size:12px;font-weight:800;color:#92400E;background:var(--amberbg);border-radius:6px;padding:2px 6px;vertical-align:middle;}
.wknav{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;}
.wknav button{min-width:52px;min-height:52px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:22px;font-weight:800;}
.wknav .t{font-weight:800;}
.modal{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));}
.sheet h3{margin:0 0 6px;font-size:20px;}
.sheet .x{float:right;border:0;background:#F1F5F9;border-radius:999px;width:44px;height:44px;font-size:22px;font-weight:800;}
.math{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px;}
.math td{padding:8px 2px;border-top:1px solid var(--line);vertical-align:top;}
.math td:last-child{text-align:right;white-space:nowrap;font-weight:700;}
.math tr.sum td{font-weight:800;border-top:2px solid var(--ink);}
.split{display:grid;grid-template-columns:1fr 96px 44px;gap:8px;align-items:center;margin:6px 0;}
.a2hs{background:#0F172A;color:#fff;border-radius:14px;padding:14px 16px;margin:0 0 14px;font-size:15px;}
.a2hs b{color:#FCD34D;}
.a2hs .row{margin-top:8px;}
.a2hs button{background:#fff;color:#0F172A;border:0;border-radius:10px;min-height:44px;padding:8px 14px;font-weight:800;}
.a2hs .x2{background:none;color:#CBD5E1;text-decoration:underline;}
.foot{margin:18px 0 0;text-align:center;}
.empty{text-align:center;color:var(--muted);font-size:15px;padding:8px 6px;}
.star{background:none;border:0;font-size:24px;min-width:44px;min-height:44px;color:#CBD5E1;}
.star.on{color:#F59E0B;}
.lock{font-size:13px;font-weight:800;color:var(--amber);}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;background:#0F172A;color:#fff;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;max-width:92vw;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
@media(min-width:760px){.modal{align-items:center;}.sheet{border-radius:18px;}}
</style>
</head>

<header class="hd">

<script>
/* YourFirstShift — On the Job, Phase 1.
   Worker-owned record. Everything stays in this browser (localStorage). No GPS, no server, no employer access.
   Paycheck numbers are ESTIMATES from a dated table file (tax-2026.json). The employer's payroll is the final word. */
(function(){
'use strict';
var KEY='yfs_otj_v1', FREE_JOBS=1, FREE_CODES=3;
var TAX=null, S=null, VIEW='today', WEEK_OFF=0, TICK=null, BIP=null;
var DAY=86400000;
var STATES=[['AL','Alabama'],['AK','Alaska'],['AZ','Arizona'],['AR','Arkansas'],['CA','California'],['CO','Colorado'],['CT','Connecticut'],['DE','Delaware'],['DC','District of Columbia'],['FL','Florida'],['GA','Georgia'],['HI','Hawaii'],['ID','Idaho'],['IL','Illinois'],['IN','Indiana'],['IA','Iowa'],['KS','Kansas'],['KY','Kentucky'],['LA','Louisiana'],['ME','Maine'],['MD','Maryland'],['MA','Massachusetts'],['MI','Michigan'],['MN','Minnesota'],['MS','Mississippi'],['MO','Missouri'],['MT','Montana'],['NE','Nebraska'],['NV','Nevada'],['NH','New Hampshire'],['NJ','New Jersey'],['NM','New Mexico'],['NY','New York'],['NC','North Carolina'],['ND','North Dakota'],['OH','Ohio'],['OK','Oklahoma'],['OR','Oregon'],['PA','Pennsylvania'],['RI','Rhode Island'],['SC','South Carolina'],['SD','South Dakota'],['TN','Tennessee'],['TX','Texas'],['UT','Utah'],['VT','Vermont'],['VA','Virginia'],['WA','Washington'],['WV','West Virginia'],['WI','Wisconsin'],['WY','Wyoming']];
var DEFAULT_LABELS={proj:'Job / Project #',po:'PO # + Line',cost:'Cost Code',wo:'Work Order #'};

/* ── helpers ── */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function pad(n){return (n<10?'0':'')+n;}
function ymd(d){d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseYmd(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(k,n){var d=parseYmd(k);d.setDate(d.getDate()+n);return ymd(d);}
function hm(ms){var d=new Date(ms);var h=d.getHours(),m=d.getMinutes();var ap=h>=12?'pm':'am';h=h%12||12;return h+':'+pad(m)+ap;}
function timeVal(ms){var d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes());}
function money(n){n=Math.round((n||0)*100)/100;return (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function hrs(n){n=Math.round((n||0)*100)/100;return (Math.round(n*100)%100===0?n.toFixed(0):n.toFixed(2).replace(/0$/,''));}
function r2(n){return Math.round(n*100)/100;}
function dayName(k,long){return parseYmd(k).toLocaleDateString('en-US',long?{weekday:'long',month:'short',day:'numeric'}:{weekday:'short'});}
function shortDate(k){return parseYmd(k).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function todayKey(){return ymd(Date.now());}
function isPro(){try{return localStorage.getItem('yfs_pro')==='1';}catch(_){return false;}}
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}

/* ── storage (never auto-deletes) ── */
function blank(){return {app:'yfs-on-the-job',v:1,created:Date.now(),settings:null,labels:Object.assign({},DEFAULT_LABELS),jobs:[],codes:[],entries:[],pto:{buckets:[]},clock:null,log:[],lastBackup:null,ui:{}};}
function load(){try{var j=JSON.parse(localStorage.getItem(KEY)||'null');if(j&&j.app==='yfs-on-the-job')return Object.assign(blank(),j);}catch(_){}return blank();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Phone storage is full. Make a Backup, then free up space.');}}
function log(entryId,field,oldV,newV,reason){S.log.push({t:Date.now(),id:entryId,field:field,old:oldV==null?'':String(oldV),new:newV==null?'':String(newV),reason:reason||''});}

/* ── hours + pay engine (pure; exposed as OTJ for tests) ── */
function entryHours(e,now){
  if(e.kind==='pto')return Math.max(0,+e.hours||0);
  if(e.manualHours!=null&&e.manualHours!=='')return Math.max(0,+e.manualHours);
  var end=e.end||now||Date.now();var ms=end-e.start;
  var brk=(+e.breakMin||0)*60000;
  (e.breaks||[]).forEach(function(b){brk+=((b.e||now||Date.now())-b.s);});
  return Math.max(0,r2((ms-brk)/3600000));}
function entryDate(e){return e.date||ymd(e.start);}
function jobOf(id){return S.jobs.filter(function(j){return j.id===id;})[0]||S.jobs[0]||{id:'',name:'My job'};}
function rateOf(job){var r=+(job&&job.rate)||+(S.settings&&S.settings.rate)||0;return r;}
function otRateOf(job){var o=+(job&&job.otRate)||+(S.settings&&S.settings.otRate)||0;return o||rateOf(job)*1.5;}
function weekStartKey(k){var ws=S.settings?+S.settings.weekStart||0:1;var d=parseYmd(k);var diff=(d.getDay()-ws+7)%7;d.setDate(d.getDate()-diff);return ymd(d);}
function liveEntries(){var a=S.entries.filter(function(e){return !e.deleted;});
  if(S.clock&&S.clock.start){a=a.concat([{id:'__live',kind:'work',start:S.clock.start,end:null,jobId:S.clock.jobId,codeId:S.clock.codeId,breaks:(S.clock.breaks||[]).concat(S.clock.onBreak?[{s:S.clock.onBreak}]:[]),live:true}]);}
  return a;}
/* One FLSA workweek: OT = worked hours over 40 per job (separate employers are not combined). PTO/holiday is paid but never counts toward 40. Breaks never count. */
function computeWeek(wsKey,now){
  var days={},i,keys=[];for(i=0;i<7;i++){var k=addDays(wsKey,i);keys.push(k);days[k]={key:k,hours:0,reg:0,ot:0,pto:0,gross:0,perDiem:0,items:[]};}
  var es=liveEntries().filter(function(e){return days[entryDate(e)];});
  var byJob={};es.forEach(function(e){var j=e.jobId||(S.jobs[0]&&S.jobs[0].id)||'';(byJob[j]=byJob[j]||[]).push(e);});
  var jobsTot={};
  Object.keys(byJob).forEach(function(jid){var job=jobOf(jid),rate=rateOf(job),otr=otRateOf(job),cum=0;
    var list=byJob[jid].slice().sort(function(a,b){return (entryDate(a)<entryDate(b)?-1:entryDate(a)>entryDate(b)?1:0)||((a.start||0)-(b.start||0));});
    var jt={worked:0,ot:0,pto:0,gross:0};
    list.forEach(function(e){var h=entryHours(e,now),d=days[entryDate(e)];var it={e:e,hours:h,reg:0,ot:0,pto:0,gross:0};
      if(e.kind==='pto'){it.pto=h;it.gross=h*rate;d.pto+=h;jt.pto+=h;}
      else{var before=cum;cum+=h;var reg=Math.max(0,Math.min(h,40-before));var ot=h-reg;it.reg=reg;it.ot=ot;it.gross=reg*rate+ot*otr;d.reg+=reg;d.ot+=ot;jt.worked+=h;jt.ot+=ot;}
      d.hours+=h;d.gross+=it.gross;jt.gross+=it.gross;d.items.push(it);});
    jobsTot[jid]=jt;});
  var pd=S.settings&&+S.settings.perDiem||0;
  keys.forEach(function(k){var d=days[k];if(pd&&d.reg+d.ot>0){d.perDiem=pd;}});
  var tot={hours:0,reg:0,ot:0,pto:0,gross:0,perDiem:0,worked:0};
  keys.forEach(function(k){var d=days[k];['hours','reg','ot','pto','gross','perDiem'].forEach(function(f){d[f]=r2(d[f]);tot[f]+=d[f];});});
  tot.worked=r2(tot.reg+tot.ot);Object.keys(tot).forEach(function(f){tot[f]=r2(tot[f]);});
  return {start:wsKey,keys:keys,days:days,tot:tot,jobs:jobsTot};}
function periodRange(k){var s=S.settings||{},p=s.period||'weekly';var d=parseYmd(k);
  if(p==='weekly'){var a=weekStartKey(k);return {from:a,to:addDays(a,6)};}
  if(p==='biweekly'){var anchor=s.anchor||weekStartKey(todayKey());var diff=Math.round((parseYmd(weekStartKey(k))-parseYmd(anchor))/DAY);var n=Math.floor(diff/14);var a2=addDays(anchor,n*14);return {from:a2,to:addDays(a2,13)};}
  if(p==='semimonthly'){var y=d.getFullYear(),m=d.getMonth();if(d.getDate()<=15)return {from:ymd(new Date(y,m,1)),to:ymd(new Date(y,m,15))};return {from:ymd(new Date(y,m,16)),to:ymd(new Date(y,m+1,0))};}
  var y2=d.getFullYear(),m2=d.getMonth();return {from:ymd(new Date(y2,m2,1)),to:ymd(new Date(y2,m2+1,0))};}
function rangeTotals(from,to,now){var t={hours:0,reg:0,ot:0,pto:0,gross:0,perDiem:0},seen={};var k=weekStartKey(from);
  while(k<=to){var w=computeWeek(k,now);w.keys.forEach(function(dk){if(dk>=from&&dk<=to&&!seen[dk]){seen[dk]=1;var d=w.days[dk];['hours','reg','ot','pto','gross','perDiem'].forEach(function(f){t[f]+=d[f];});}});k=addDays(k,7);}
  Object.keys(t).forEach(function(f){t[f]=r2(t[f]);});return t;}
/* Take-home ESTIMATE for one pay period. IRS Pub 15-T Worksheet 1A (annual percentage method, 2020+ W-4, Step 2 not checked). */
function takeHome(gross,perDiem,set,tax){set=set||{};tax=tax||TAX;var lines=[];var periods=tax.pay_periods[set.period||'weekly'];
  var pdNT=set.perDiemNT?perDiem:0, pdT=set.perDiemNT?0:perDiem;
  var total=r2(gross+perDiem);
  var k401=+set.k401||0, health=+set.health||0;
  var fitW=Math.max(0,r2(total-pdNT-k401-health));
  var ficaW=Math.max(0,r2(total-pdNT-health));
  var annual=fitW*periods;var adj=(set.filing==='mfj'?tax.worksheet_1a_line_1g.mfj:tax.worksheet_1a_line_1g.other);
  var aaw=Math.max(0,annual-adj);var tbl=tax.federal_standard_annual[set.filing==='mfj'?'mfj':set.filing==='hoh'?'hoh':'single'];var row=tbl[0];
  for(var i=0;i<tbl.length;i++){if(aaw>=tbl[i][0]&&(tbl[i][1]==null||aaw<tbl[i][1])){row=tbl[i];break;}}
  var tentA=row[2]+(aaw-row[0])*row[3];var fed=tentA/periods-(+set.credits||0)/periods;fed=Math.max(0,r2(fed))+(+set.extraWH||0);fed=r2(fed);
  var ss=r2(ficaW*tax.ss_rate),med=r2(ficaW*tax.medicare_rate),addl=0;
  if(ficaW*periods>tax.additional_medicare_threshold){addl=r2((ficaW*periods-tax.additional_medicare_threshold)/periods*tax.additional_medicare_rate);}
  var st=set.state||'',noTax=tax.no_wage_tax_states.indexOf(st)>=0,stRate=+set.stateRate||0,stateAmt=noTax?0:r2(fitW*stRate/100);
  lines.push({k:'Gross pay (hours × rate, OT, PTO)',v:gross});
  if(perDiem)lines.push({k:'Per diem',v:perDiem});
  if(k401)lines.push({k:'Pre-tax 401(k)',v:-k401});
  if(health)lines.push({k:'Pre-tax health',v:-health});
  lines.push({k:'Federal income tax (IRS Pub 15-T 2026, '+(set.filing==='mfj'?'married filing jointly':set.filing==='hoh'?'head of household':'single')+')',v:-fed});
  lines.push({k:'Social Security (6.2%)',v:-ss});
  lines.push({k:'Medicare (1.45%)',v:-med});
  if(addl)lines.push({k:'Additional Medicare (0.9%)',v:-addl});
  if(noTax)lines.push({k:'No state income tax on wages ('+st+')',v:0});
  else if(stRate)lines.push({k:'Your rate ('+stRate+'%)',v:-stateAmt});
  else lines.push({k:'State tax not included. Add your rate in Pay setup.',v:0,warn:true});
  var net=r2(total-k401-health-fed-ss-med-addl-stateAmt);
  return {gross:gross,perDiem:perDiem,total:total,fitWages:fitW,ficaWages:ficaW,fed:fed,ss:ss,med:med,addl:addl,state:stateAmt,stateNoTax:noTax,net:net,lines:lines,periods:periods,pdNT:pdNT};}
/* PTO balance: start balance + accruals (capped) − PTO used; optional Jan 1 carryover limit. */
function ptoBalance(b,asOf,now){asOf=asOf||todayKey();var bal=+b.start||0,used=0,earned=0;var start=b.startDate||'1970-01-01';var ev=[];
  S.entries.filter(function(e){return !e.deleted;}).forEach(function(e){var dk=entryDate(e);if(dk<start)return;
    if(e.kind==='pto'&&e.bucket===b.id){ev.push({d:dk,t:1,amt:-(+e.hours||0)});return;} /* planned PTO counts as used right away */
    if(dk>asOf)return;
    else if(e.kind!=='pto'&&b.type==='perHours'&&(+b.per||0)>0&&(!b.jobId||e.jobId===b.jobId)&&(e.end||(e.manualHours!=null&&e.manualHours!=='')))ev.push({d:dk,t:0,amt:(+b.earn||0)*entryHours(e,now)/(+b.per)});});
  if(b.type==='perPeriod'&&(+b.earn||0)>0){var k=start;var guard=0;while(k<=asOf&&guard++<2000){var pr=periodRange(k);if(pr.to<=asOf&&pr.to>=start)ev.push({d:pr.to,t:0,amt:+b.earn});k=addDays(pr.to,1);}}
  var y0=+start.slice(0,4),y1=+asOf.slice(0,4);for(var y=y0+1;y<=y1;y++){var jan=y+'-01-01';if(jan<=asOf){ev.push({d:jan,t:-1});if(b.type==='yearly'&&(+b.earn||0)>0)ev.push({d:jan,t:0,amt:+b.earn,yr:1});}}
  ev=ev.filter(function(x){return x.t===1||x.d<=asOf;});ev.sort(function(a,c){return a.d<c.d?-1:a.d>c.d?1:a.t-c.t;});
  var cap=b.cap===''||b.cap==null?null:+b.cap,carry=b.carry===''||b.carry==null?null:+b.carry;
  ev.forEach(function(x){if(x.t===-1){if(carry!=null)bal=Math.min(bal,carry);return;}
    if(x.amt>=0){var nb=bal+x.amt;if(cap!=null)nb=Math.min(nb,Math.max(bal,cap));earned+=nb-bal;bal=nb;}else{bal+=x.amt;used-=x.amt;}});
  return {balance:r2(bal),used:r2(used),earned:r2(earned)};}

function act(a,el){
  if(a==='a2hsx'){S.ui.a2hsX=1;save();render();return;}
  if(a==='install'&&BIP){BIP.prompt();BIP.userChoice.finally(function(){BIP=null;render();});return;}
  if(a==='start')return clockStart();
  if(a==='stop')return clockStop();
  if(a==='break')return clockBreak();
  if(a==='add')return editEntry(null,{date:todayKey()});
  if(a==='addpto'){if(!S.pto.buckets.length){ptoDefaults();}return editEntry(null,{date:todayKey(),kind:'pto'});}
  if(a==='repeat')return repeatYesterday();
  if(a==='gopay'){go('week');return;}
  if(a==='wprev'){WEEK_OFF--;render();return;}
  if(a==='wnext'){WEEK_OFF++;render();return;}
  if(a==='math')return mathModal(el.dataset.scope,el.dataset.from,el.dataset.to);
  if(a==='ptoDefaults'){ptoDefaults();render();return;}
  if(a==='addbucket')return bucketModal(null);
  if(a==='addjob'){if(!isPro()&&S.jobs.length>=FREE_JOBS)return upsell('Free covers 1 job. Pro tracks every job you work, with overtime figured separately for each employer.');return jobModal(null);}
  if(a==='addcode'){if(!isPro()&&S.codes.length>=FREE_CODES)return upsell('Free covers '+FREE_CODES+' charge codes. Pro saves unlimited codes and lets you rename the labels.');return codeModal(null);}
  if(a==='labels'){if(!isPro())return upsell('Rename the code labels to what your company calls them (WBS, AFE, Cost Center...).');return labelsModal();}
  if(a==='setup'){$('#view').innerHTML=setupHTML(false);wireSetup(false);return;}
  if(a==='backup')return backup();
  if(a==='restore'){$('#restoreFile').click();return;}
  if(a==='csv')return csvModal();
  if(a==='logview'){if(!isPro())return upsell('See every change with the time, the old value and the new value. Your history is always saved (free) and included in your Backup; viewing it here is Pro.');return logModal();}}

function clockStart(){var jid=($('#cJob')||{}).value||(S.jobs[0]&&S.jobs[0].id);var cid=($('#cCode')||{}).value||'';
  S.clock={start:Date.now(),jobId:jid,codeId:cid,breaks:[],onBreak:null};S.ui.lastJob=jid;S.ui.lastCode=cid;save();render();toast('Clocked in at '+hm(S.clock.start)+'.');}
function clockBreak(){var c=S.clock;if(!c)return;if(c.onBreak){c.breaks.push({s:c.onBreak,e:Date.now()});c.onBreak=null;toast('Back on the clock.');}else{c.onBreak=Date.now();toast('Break started. Break time doesn\'t count.');}save();render();}
function clockStop(){var c=S.clock;if(!c)return;var now=Date.now();if(c.onBreak){c.breaks.push({s:c.onBreak,e:now});c.onBreak=null;}
  var brk=Math.round(c.breaks.reduce(function(a,b){return a+(b.e-b.s);},0)/60000);
  var e={id:uid(),kind:'work',date:ymd(c.start),start:c.start,end:now,breakMin:brk,jobId:c.jobId,codeId:c.codeId||'',splits:[],note:'',created:now,src:'clock'};
  S.entries.push(e);log(e.id,'(created)','',entrySummary(e),'clock');S.clock=null;save();render();toast('Saved: '+hrs(entryHours(e))+' hrs.');}
/* v2 hook (not built): an opt-in native wrapper may call OTJ.autoClock('start'|'stop') after the user confirms. Location never leaves the phone. */
function autoClockHook(kind){return false;}
function repeatYesterday(){var y=addDays(todayKey(),-1),tk=todayKey();var src=S.entries.filter(function(e){return !e.deleted&&entryDate(e)===y;});
  if(!src.length){toast('Nothing logged yesterday to repeat.');return;}
  src.forEach(function(e){var n=JSON.parse(JSON.stringify(e));n.id=uid();n.date=tk;n.created=Date.now();n.src='repeat';if(n.start){n.start+=DAY;}if(n.end){n.end+=DAY;}delete n.orig;S.entries.push(n);log(n.id,'(created)','',entrySummary(n),'repeat yesterday');});
  save();render();toast('Copied '+src.length+' entr'+(src.length>1?'ies':'y')+' from yesterday. Tap to adjust.');}
function entrySummary(e){return entryDate(e)+' '+(e.kind==='pto'?'PTO '+hrs(+e.hours)+'h '+bucketName(e.bucket):(e.manualHours!=null&&e.manualHours!==''?hrs(+e.manualHours)+'h':hm(e.start)+'-'+(e.end?hm(e.end):'')+' break '+(+e.breakMin||0)+'m'))+(e.codeId?' code '+codeName(e.codeId):'')+(e.splits&&e.splits.length?' split '+e.splits.map(function(s){return codeName(s.codeId)+' '+s.hours+'h';}).join('+'):'');}

  modal('<button class="x" data-close aria-label="Close">×</button><h3>'+esc(dayName(k,true))+'</h3><div class="muted">'+hrs(d.hours)+' hrs · '+money(d.gross+d.perDiem)+' <span class="est">estimate</span></div>'+(items.length?entryList(items):'<div class="empty">Nothing logged this day.</div>')+'<button type="button" class="btn go block" style="margin-top:12px" id="dAdd">+ Add hours</button><button type="button" class="btn ghost block" style="margin-top:8px" id="dPto">PTO</button>',function(m){
    m.querySelectorAll('[data-edit]').forEach(function(b){b.addEventListener('click',function(){editEntry(b.dataset.edit);});});
    $('#dAdd').addEventListener('click',function(){editEntry(null,{date:k});});$('#dPto').addEventListener('click',function(){if(!S.pto.buckets.length)ptoDefaults();editEntry(null,{date:k,kind:'pto'});});});}

function mathModal(scope,from,to){var t,th,title;
  if(scope==='period'){t=rangeTotals(from,to);th=takeHome(t.gross,t.perDiem,S.settings);title='Pay period '+shortDate(from)+' – '+shortDate(to);}
  else{var wsk=addDays(weekStartKey(todayKey()),WEEK_OFF*7);var w=computeWeek(wsk);t=w.tot;th=takeHomeFor(t.gross,t.perDiem,'week');title='Week of '+shortDate(wsk);}
  var rate=rateOf(S.jobs[0]),otr=otRateOf(S.jobs[0]);
  var rows='<tr><td>Regular '+hrs(t.reg)+' hrs'+(S.jobs.length<=1?' × '+money(rate):'')+'</td><td>'+money(S.jobs.length<=1?t.reg*rate:0)+'</td></tr>';
  if(S.jobs.length>1)rows='<tr><td>Regular + OT across '+S.jobs.length+' jobs (each job\'s own rate)</td><td></td></tr>';
  else{if(t.ot)rows+='<tr><td>Overtime '+hrs(t.ot)+' hrs × '+money(otr)+'</td><td>'+money(t.ot*otr)+'</td></tr>';if(t.pto)rows+='<tr><td>PTO '+hrs(t.pto)+' hrs × '+money(rate)+' (doesn\'t count toward 40)</td><td>'+money(t.pto*rate)+'</td></tr>';}
  th.lines.forEach(function(l){rows+='<tr><td'+(l.warn?' style="color:#92400E"':'')+'>'+esc(l.k)+'</td><td>'+(l.warn?'':(l.v<0?'−'+money(-l.v):money(l.v)))+'</td></tr>';});
  rows+='<tr class="sum"><td>Est. take-home</td><td>'+money(th.net)+'</td></tr>';
  var note=(TAX.state_notes&&TAX.state_notes[S.settings.state]&&S.settings.state==='WA')?'<p class="fine">'+esc(TAX.state_notes.WA)+'</p>':'';
  modal('<button class="x" data-close aria-label="Close">×</button><h3>Show the math</h3><div class="muted">'+esc(title)+'</div><table class="math">'+rows+'</table>'+note+
    '<p class="fine">Federal: annualized pay ('+money(th.fitWages)+' × '+th.periods+' checks) minus the IRS Worksheet 1A adjustment, run through the 2026 annual table, then ÷ '+th.periods+'. '+(th.pdNT?'Per diem left out of taxes because you marked it non-taxable. ':'')+'Social Security stops after $184,500 earned in the year (not tracked across checks here).</p>'+
    '<p class="fine"><span class="est">Estimate only.</span> Your employer\'s payroll is the final word. '+esc(TAX.label)+'.</p>');}

/* ── PTO ── */
function ptoDefaults(){if(S.pto.buckets.length)return;var sd=todayKey();S.pto.buckets=[{id:uid(),name:'Vacation',type:'none',earn:'',per:'',start:0,startDate:sd,cap:'',carry:''},{id:uid(),name:'Sick',type:'perHours',earn:1,per:30,start:0,startDate:sd,cap:'',carry:''},{id:uid(),name:'Holiday',type:'none',earn:'',per:'',start:0,startDate:sd,cap:'',carry:''}];log('pto','(buckets)','','Vacation, Sick, Holiday');save();}
function bucketModal(id){var b=id?S.pto.buckets.filter(function(x){return x.id===id;})[0]:{id:uid(),name:'',type:'none',earn:'',per:'',start:0,startDate:todayKey(),cap:'',carry:''};var isNew=!id;
  modal('<button class="x" data-close aria-label="Close">×</button><h3>'+(isNew?'New PTO bucket':esc(b.name))+'</h3>'+
    '<label class="f" for="bN">Name</label><input class="i" id="bN" value="'+esc(b.name)+'" placeholder="Vacation">'+
    '<label class="f" for="bS">Balance on start date, hrs</label><input class="i" id="bS" inputmode="decimal" value="'+esc(b.start)+'">'+
    '<label class="f" for="bSD">Start date</label><input class="i" type="date" id="bSD" value="'+esc(b.startDate)+'">'+
    '<label class="f" for="bT">How you earn it</label><select class="i" id="bT">'+[['none','I\'ll set the balance by hand'],['perHours','Hours per hours worked (e.g. 1 per 30)'],['perPeriod','Hours each pay period'],['yearly','A lump each January 1']].map(function(o){return '<option value="'+o[0]+'"'+(b.type===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>'+
    '<div class="row"><div class="grow"><label class="f" for="bE">Earn (hrs)</label><input class="i" id="bE" inputmode="decimal" value="'+esc(b.earn)+'"></div><div class="grow" id="bPerW"><label class="f" for="bP">per hrs worked</label><input class="i" id="bP" inputmode="decimal" value="'+esc(b.per)+'"></div></div>'+
    '<div class="row"><div class="grow"><label class="f" for="bC">Max balance (cap)</label><input class="i" id="bC" inputmode="decimal" value="'+esc(b.cap)+'" placeholder="none"></div><div class="grow"><label class="f" for="bCo">Carryover limit Jan 1</label><input class="i" id="bCo" inputmode="decimal" value="'+esc(b.carry)+'" placeholder="none"></div></div>'+
    (S.jobs.length>1?'<label class="f" for="bJ">Earned from job</label><select class="i" id="bJ"><option value="">All jobs</option>'+S.jobs.map(function(j){return '<option value="'+esc(j.id)+'"'+(j.id===b.jobId?' selected':'')+'>'+esc(j.name)+'</option>';}).join('')+'</select>':'')+
    '<div class="fine" style="margin-top:8px">Check your handbook or pay stub for your real accrual rule.</div>'+
    '<button type="button" class="btn go block" style="margin-top:14px" id="bSave">Save</button>',function(){
    function v(){var t=$('#bT').value;$('#bPerW').hidden=t!=='perHours';$('#bE').closest('.row').hidden=t==='none';}$('#bT').addEventListener('change',v);v();
    $('#bSave').addEventListener('click',function(){var n=Object.assign({},b,{name:($('#bN').value||'').trim()||'PTO',start:+$('#bS').value||0,startDate:$('#bSD').value||todayKey(),type:$('#bT').value,earn:$('#bE').value,per:$('#bP').value,cap:$('#bC').value,carry:$('#bCo').value,jobId:($('#bJ')||{}).value||''});
      if(isNew){S.pto.buckets.push(n);log('pto','(bucket added)','',n.name);}else{var i=S.pto.buckets.indexOf(b);log('pto','bucket '+b.name,JSON.stringify(b),JSON.stringify(n));S.pto.buckets[i]=n;}save();closeModal();render();});});}

/* ── jobs + codes ── */
function jobModal(id){var j=id?S.jobs.filter(function(x){return x.id===id;})[0]:{id:uid(),name:'',rate:'',otRate:'',active:true,created:Date.now()};var isNew=!id;
  modal('<button class="x" data-close aria-label="Close">×</button><h3>'+(isNew?'Add a job':'Job')+'</h3><label class="f" for="jN">Job name</label><input class="i" id="jN" value="'+esc(j.name)+'">'+
  '<label class="f" for="jR">Hourly rate <span class="muted">(blank = '+money(+S.settings.rate)+')</span></label><input class="i" id="jR" inputmode="decimal" value="'+esc(j.rate)+'">'+
  '<label class="f" for="jO">OT rate <span class="muted">(blank = 1.5×)</span></label><input class="i" id="jO" inputmode="decimal" value="'+esc(j.otRate)+'">'+
  (isNew?'':'<label class="chk"><input type="checkbox" id="jC"'+(j.active===false?' checked':'')+'><span>Closed (keeps all history, hides from the pick list)</span></label>')+
  '<button type="button" class="btn go block" style="margin-top:14px" id="jS">Save</button>',function(){$('#jS').addEventListener('click',function(){var n=Object.assign({},j,{name:($('#jN').value||'').trim()||'Job',rate:$('#jR').value,otRate:$('#jO').value,active:!($('#jC')&&$('#jC').checked)});
    if(isNew){S.jobs.push(n);log('job','(added)','',n.name);}else{log('job',j.name,JSON.stringify(j),JSON.stringify(n));S.jobs[S.jobs.indexOf(j)]=n;}save();closeModal();render();});});}
function codeModal(id){var c=id?S.codes.filter(function(x){return x.id===id;})[0]:{id:uid(),nick:'',jobId:S.jobs[0]&&S.jobs[0].id,fields:{proj:'',po:'',cost:'',wo:''},active:true,fav:false,created:Date.now()};var isNew=!id;
  modal('<button class="x" data-close aria-label="Close">×</button><h3>'+(isNew?'Add a charge code':'Charge code')+'</h3><label class="f" for="cN">Nickname</label><input class="i" id="cN" value="'+esc(c.nick)+'" placeholder="e.g. Tie-in Station 9">'+
  (S.jobs.length>1?'<label class="f" for="cJ">Job</label><select class="i" id="cJ">'+S.jobs.map(function(j){return '<option value="'+esc(j.id)+'"'+(j.id===c.jobId?' selected':'')+'>'+esc(j.name)+'</option>';}).join('')+'</select>':'')+
  ['proj','po','cost','wo'].map(function(k){return '<label class="f" for="cf_'+k+'">'+esc(S.labels[k])+'</label><input class="i" id="cf_'+k+'" value="'+esc(c.fields[k]||'')+'">';}).join('')+
  (isNew?'':'<label class="chk"><input type="checkbox" id="cC"'+(c.active===false?' checked':'')+'><span>Closed (stays in history and exports, hidden from the pick list)</span></label>')+
  '<button type="button" class="btn go block" style="margin-top:14px" id="cS">Save</button>',function(){$('#cS').addEventListener('click',function(){var f={};['proj','po','cost','wo'].forEach(function(k){f[k]=($('#cf_'+k).value||'').trim();});
    var n=Object.assign({},c,{nick:($('#cN').value||'').trim()||f.proj||'Code',jobId:($('#cJ')||{}).value||c.jobId,fields:f,active:!($('#cC')&&$('#cC').checked)});
    if(isNew){S.codes.push(n);log('code','(added)','',n.nick);}else{log('code',c.nick,JSON.stringify(c),JSON.stringify(n));S.codes[S.codes.indexOf(c)]=n;}save();closeModal();render();});});}
function labelsModal(){modal('<button class="x" data-close aria-label="Close">×</button><h3>Rename code labels</h3><div class="fine">Use what your company calls them: WBS, AFE #, Cost Center, Field Ticket #...</div>'+['proj','po','cost','wo'].map(function(k){return '<label class="f" for="l_'+k+'">'+esc(DEFAULT_LABELS[k])+'</label><input class="i" id="l_'+k+'" value="'+esc(S.labels[k])+'">';}).join('')+'<button type="button" class="btn go block" style="margin-top:14px" id="lS">Save</button>',function(){$('#lS').addEventListener('click',function(){var o=JSON.stringify(S.labels);['proj','po','cost','wo'].forEach(function(k){S.labels[k]=($('#l_'+k).value||'').trim()||DEFAULT_LABELS[k];});log('labels','labels',o,JSON.stringify(S.labels));save();closeModal();render();});});}

/* ── change history (always written; view is Pro) ── */
function logModal(){var rows=S.log.slice().reverse().slice(0,400).map(function(l){return '<tr><td><b>'+esc(new Date(l.t).toLocaleString())+'</b><br>'+esc(l.field)+(l.reason?' · <i>'+esc(l.reason)+'</i>':'')+'<br><span class="fine">'+(l.old?'was: '+esc(l.old.slice(0,160))+'<br>':'')+(l.new?'now: '+esc(l.new.slice(0,160)):'')+'</span></td></tr>';}).join('');
  modal('<button class="x" data-close aria-label="Close">×</button><h3>Change history</h3><div class="fine">'+S.log.length+' changes. Newest first.</div><table class="math">'+(rows||'<tr><td>No changes yet.</td></tr>')+'</table>');}

/* ── export / backup / restore ── */
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function buildCSV(f){f=f||{};var rows=[['Date','Day','Job','Type','Start','End','Break min','Hours','Regular','Overtime','PTO','PTO bucket','Charge code',S.labels.proj,S.labels.po,S.labels.cost,S.labels.wo,'Split hours','Gross (estimate)','Note','Entry ID']];
  var ents=S.entries.filter(function(e){return !e.deleted;}).slice().sort(function(a,b){return entryDate(a)<entryDate(b)?-1:entryDate(a)>entryDate(b)?1:(a.start||0)-(b.start||0);});
  var weeks={};function w(k){var ws=weekStartKey(k);return weeks[ws]||(weeks[ws]=computeWeek(ws));}
  ents.forEach(function(e){var dk=entryDate(e);if(f.from&&dk<f.from)return;if(f.to&&dk>f.to)return;if(f.job&&e.jobId!==f.job)return;
    var codesList=e.splits&&e.splits.length?e.splits:[{codeId:e.codeId,hours:null}];if(f.code&&!codesList.some(function(s){return s.codeId===f.code;}))return;
    var it=w(dk).days[dk].items.filter(function(x){return x.e.id===e.id;})[0]||{hours:entryHours(e),reg:0,ot:0,pto:0,gross:0};
    codesList.forEach(function(sp,i){var c=S.codes.filter(function(x){return x.id===sp.codeId;})[0];var cf=c?c.fields:{};var share=codesList.length>1?(+sp.hours||0)/(it.hours||1):1;
      rows.push([dk,dayName(dk),jobOf(e.jobId).name,e.kind==='pto'?'PTO':'Worked',e.kind==='pto'||e.manualHours!=null&&e.manualHours!==''?'':timeVal(e.start),e.kind==='pto'||!e.end?'':timeVal(e.end),e.kind==='pto'?'':(+e.breakMin||0),
        r2(codesList.length>1?(+sp.hours||0):it.hours),r2(it.reg*share),r2(it.ot*share),r2(it.pto*share),e.kind==='pto'?bucketName(e.bucket):'',c?c.nick:'',cf.proj||'',cf.po||'',cf.cost||'',cf.wo||'',codesList.length>1?sp.hours:'',r2(it.gross*share),e.note||'',e.id]);});});
  return rows.map(function(r){return r.map(csvCell).join(',');}).join('\r\n')+'\r\n';}
function csvModal(){var pro=isPro();
  modal('<button class="x" data-close aria-label="Close">×</button><h3>Export CSV</h3>'+(pro?'<div class="row"><div class="grow"><label class="f" for="xF">From</label><input class="i" type="date" id="xF"></div><div class="grow"><label class="f" for="xT">To</label><input class="i" type="date" id="xT"></div></div>'+
    (S.jobs.length>1?'<label class="f" for="xJ">Job</label><select class="i" id="xJ"><option value="">All jobs</option>'+S.jobs.map(function(j){return '<option value="'+esc(j.id)+'">'+esc(j.name)+'</option>';}).join('')+'</select>':'')+
    (S.codes.length?'<label class="f" for="xC">Charge code</label><select class="i" id="xC"><option value="">All codes</option>'+S.codes.map(function(c){return '<option value="'+esc(c.id)+'">'+esc(c.nick)+'</option>';}).join('')+'</select>':''):'<div class="fine">Exports every entry you have (always free). Filtering by date, job or code is Pro.</div>')+
    '<button type="button" class="btn go block" style="margin-top:14px" id="xGo">Download CSV</button>'+(pro?'':'<button type="button" class="link" id="xUp">Filter by date, job or code (Pro)</button>'),function(){
    $('#xGo').addEventListener('click',function(){var f=pro?{from:($('#xF')||{}).value,to:($('#xT')||{}).value,job:($('#xJ')||{}).value,code:($('#xC')||{}).value}:{};
      deliver(new Blob([buildCSV(f)],{type:'text/csv;charset=utf-8'}),'yfs-on-the-job-'+todayKey()+'.csv');closeModal();});
    var up=$('#xUp');if(up)up.addEventListener('click',function(){upsell('Filter your export by date range, job or charge code for timesheets and audits.');});});}
function backupObj(){return {app:'yfs-on-the-job',kind:'backup',v:1,exported:Date.now(),data:S};}
function deliver(blob,name){try{var file=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[file]})&&/iPhone|iPad|Android/.test(navigator.userAgent)){navigator.share({files:[file],title:name}).catch(function(){dl(blob,name);});return;}}catch(_){}dl(blob,name);}
function dl(blob,name){var u=URL.createObjectURL(blob);var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);}
function backup(){S.lastBackup=Date.now();save();var txt=JSON.stringify(backupObj());deliver(new Blob([txt],{type:'application/json'}),'yfs-on-the-job-backup-'+todayKey()+'.json');render();toast('Backup made. Keep the file somewhere safe.');}
function restoreFile(ev){var f=ev.target.files&&ev.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var j=JSON.parse(rd.result);if(!j||j.app!=='yfs-on-the-job'||!j.data||!Array.isArray(j.data.entries))throw new Error('x');
    if(!confirm('Restore this backup from '+new Date(j.exported).toLocaleString()+'? It replaces what\'s on this phone now ('+S.entries.length+' entries) with the backup ('+j.data.entries.length+' entries).'))return;
    S=Object.assign(blank(),j.data);log('backup','(restored)','',new Date(j.exported).toISOString()+' · '+j.data.entries.length+' entries');save();render();toast('Restored. All your records are back.');}catch(_){alert('That file isn\'t an On the Job backup.');}};rd.readAsText(f);ev.target.value='';}

/* ── boot ── */
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();BIP=e;if(S&&S.settings)render();});
window.addEventListener('pageshow',function(e){if(e.persisted&&S){S=load();render();}});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&S){S=load();render();}});
window.addEventListener('storage',function(e){if(e.key===KEY||e.key==='yfs_pro'){S=load();render();}});
window.OTJ={entryHours:entryHours,computeWeek:computeWeek,takeHome:takeHome,ptoBalance:ptoBalance,periodRange:periodRange,rangeTotals:rangeTotals,buildCSV:buildCSV,state:function(){return S;},reload:function(){S=load();render();},tax:function(){return TAX;},autoClock:autoClockHook,
  hash:function(o){var t=new TextEncoder().encode(JSON.stringify(o||S));return crypto.subtle.digest('SHA-256',t).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});}};
S=load();VIEW=(S.ui&&S.ui.view)||'today';
fetch('/job/tax-2026.json',{cache:'no-cache'}).then(function(r){return r.json();}).then(function(t){TAX=t;render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(_){}}).catch(function(){$('#view').innerHTML='<div class="card">Couldn\'t load the pay tables. Check your signal and reload once; after that it works offline.</div>';});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/job/sw.js',{scope:'/job/'}).catch(function(){});});}
})();
</script>
